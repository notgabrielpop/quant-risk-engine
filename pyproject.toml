[build-system]
requires = ["setuptools>=68.0", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk-engine"
version = "0.1.0"
description = "Quantitative risk engine for multi-asset portfolio simulation"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pmdarima>=2.0",
    "arch>=6.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
notebooks = ["jupyter>=1.0"]
